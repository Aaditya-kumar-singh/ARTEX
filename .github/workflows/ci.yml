name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Go tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: artex-ci-test
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run backend tests with isolated databases
        env:
          POSTGRES_PASSWORD: artex-ci-test
        shell: bash
        run: |
          set -euo pipefail

          # Each Go package gets a fresh database. ARTEX integration tests create
          # persistent task/settings fixtures, so sharing one database across
          # packages can cause cross-package test interference.
          while IFS= read -r package; do
            db_suffix="$(printf '%s' "$package" | sha256sum | cut -c1-12)"
            database="artex_ci_${db_suffix}"
            echo "::group::go test $package ($database)"
            ARTEX_PG_DSN="postgres://postgres:${POSTGRES_PASSWORD}@127.0.0.1:5432/${database}?sslmode=disable" \
              go test "$package" -count=1
            echo "::endgroup::"
          done < <(go list ./...)

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Run frontend tests
        working-directory: web
        run: npm run test:i18n

      - name: Build static frontend
        working-directory: web
        run: npm run build:static
